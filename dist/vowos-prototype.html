/* ------------------------------------------------------------------ reset */

*, *::before, *::after { box-sizing: border-box; }

html {

  justify-content: center;

.vow-btn--primary:hover { background: var(--vow-color-terracotta-deep); }

.vow-surface--airy { padding: var(--vow-space-7); }

}

.vow-panel {
  background: var(--vow-color-porcelain);
  border: 1px solid var(--vow-color-hairline);
  border-radius: var(--vow-radius-card);

}

  display: flex;
  align-items: flex-start;
  gap: var(--vow-space-2);
  font-size: var(--vow-font-size-meta);
  line-height: var(--vow-line-height-meta);
  color: var(--vow-color-ash);
}

.vow-evidence__icon {
  flex: none;
  width: 15px;
  height: 15px;
  margin-top: 2px;

.vow-evidence[data-state='reported'] .vow-evidence__icon { color: var(--vow-color-ash); }
.vow-evidence[data-state='inferred'] .vow-evidence__icon { color: var(--vow-color-ash); }
.vow-evidence[data-state='unknown'] .vow-evidence__icon { color: var(--vow-color-ash); }

.vow-evidence__value { color: var(--vow-color-ink); font-weight: 500; }

.vow-evidence-list {
  display: flex;
  flex-direction: column;
  gap: var(--vow-space-3);
}

  align-items: center;
  gap: var(--vow-space-2);
  background: none;
  border: none;
  padding: var(--vow-space-2) 0;
  font-size: var(--vow-font-size-meta);

  color: var(--vow-color-ink);

.vow-agent-note--action { border-left-color: var(--vow-color-terracotta); }

  align-items: flex-start;
  gap: var(--vow-space-3);
}

.vow-partner__initials {
  flex: none;

  height: 30px;
  border-radius: 50%;
  display: grid;
  place-items: center;
  font-size: var(--vow-font-size-label);
  font-weight: 600;
  color: var(--vow-color-ink);
  background: var(--vow-color-rose-clay);
}

.vow-partner__initials[data-person='b'] { background: var(--vow-color-mist-blue); }

.vow-partner__body { font-size: var(--vow-font-size-body-small); }

/* ---------------------------------------------------------- 11.2 / chips */

.vow-chip {
  display: inline-flex;
  align-items: center;
  gap: var(--vow-space-1);
  padding: 4px var(--vow-space-2);
  border-radius: var(--vow-radius-sm);

}

  border: 1px solid var(--vow-color-hairline-strong);
  color: var(--vow-color-ash);
  font-weight: 500;
}

/* Status is text, not a colored pill (UI Plan 9.1). */

  font-size: var(--vow-font-size-meta);
  font-weight: 600;
  color: var(--vow-color-ash);
  display: inline-flex;
  align-items: center;
  gap: 6px;
}

.vow-status svg { width: 14px; height: 14px; }
.vow-status[data-tone='ready'] { color: var(--vow-color-moss); }
.vow-status[data-tone='risk'] { color: var(--vow-color-alert); }

/* ----------------------------------------------------- 11.2 / place card */

  display: grid;
  grid-template-columns: 316px minmax(0, 1fr);
  gap: var(--vow-space-5);
  padding: var(--vow-space-4);
  border: 1px solid transparent;
  border-radius: var(--vow-radius-surface);
  text-align: left;
  background: none;
  width: 100%;
  cursor: pointer;
  transition:
    background var(--vow-motion-base) var(--vow-motion-ease),
    border-color var(--vow-motion-base) var(--vow-motion-ease),
    opacity var(--vow-motion-base) var(--vow-motion-ease);
}

.vow-place:hover {
  background: var(--vow-color-paper);
  border-color: var(--vow-color-hairline);
}

.vow-place[data-status='ruled-out'] { opacity: 0.5; }

  overflow: hidden;
  background: var(--vow-color-paper);
  aspect-ratio: 4 / 3;

.vow-media--wide { aspect-ratio: 3 / 2; }
.vow-media--tall { aspect-ratio: 3 / 4; }

.vow-place__reason { font-size: var(--vow-font-size-body-small); max-width: 54ch; }

  gap: var(--vow-space-2);
  font-size: var(--vow-font-size-meta);
  color: var(--vow-color-ash);
  max-width: 54ch;
}

.vow-reality svg { width: 15px; height: 15px; flex: none; margin-top: 2px; }

  display: grid;
  grid-template-columns: 132px minmax(0, 1fr);
  gap: var(--vow-space-4);
  padding: var(--vow-space-4) 0;
  border-top: 1px solid var(--vow-color-hairline);
  align-items: start;

/* VowOS prototype — trust data model and agent permission model.
 *
 * Masterplan sections 3 and 5. The roadmap requires both of these to work as
 * systems before any priority artifact goes to high fidelity, because the UI
 * patterns they support ("Verified by the venue on June 8", "I have sent the
 * five venue inquiries you approved") are promises the data layer has to keep.
 *

 * rendered from a fact resolved through V.trust.resolve().

      name: 'Confirmed',
      icon: 'check',

    },
    reported: {
      id: 'reported',
      name: 'Reported',
      icon: 'doc',
      definition: 'Stated by a third party but not confirmed by the primary source.',
    },
    inferred: {
      id: 'inferred',
      name: 'Inferred',
      icon: 'approx',
      definition: 'Derived by the agent from a pattern, not stated by anyone.',
    },
    unknown: {
      id: 'unknown',
      name: 'Unknown',
      icon: 'unknown',
      definition: 'Actively not established, and the agent knows it.',

  };

     past its window downgrades one level, toward Reported, without waiting for
     a user to notice a discrepancy. Masterplan section 3. */
  const FRESHNESS = {
    availability: 14,
    pricing: 90,
    policy: 180,
    capability: 365,
    contract: 365,
  };

    availability: 'Availability',
    pricing: 'Pricing',
    policy: 'Policy',
    capability: 'Capacity and capability',
    contract: 'Contract',
  };

     Rather than trusting reviewers to catch it, an unstated state resolves to
     Unknown and reports itself, because a silent omission reads as confidence
     the product does not have. */
  function normalize(fact) {
    if (!fact) return null;
    if (!fact.state || !STATES[fact.state]) {
      if (typeof console !== 'undefined' && console.warn) {
        console.warn(
          `[VowOS trust] Fact "${fact.id || fact.label}" has no resolved state. ` +
          'Rendering as Unknown per Masterplan section 3.'
        );

      return Object.assign({}, fact, { state: 'unknown', value: fact.value || null });

  function resolve(rawFact, now) {
    const fact = normalize(rawFact);

    const today = now || V.NOW;
    let state = fact.state;
    let downgraded = false;
    let ageDays = null;

    if (fact.asOf) {
      ageDays = V.daysBetween(fact.asOf, today);
      if (state === 'confirmed' && window && ageDays > window) {

      state,
      originalState: fact.state,
      downgraded,
      ageDays,
      window: window || null,
      meta: STATES[state],
      line: describe(fact, state, downgraded, window),

/* VowOS prototype — the component language from UI Plan 11.2.
 *
 * Each component here corresponds to a row in that table and carries its design
 * rule as a comment, so the rule travels with the implementation rather than
 * living in a document an engineer may never open (Masterplan section 9, step 2).
 */
(function (V) {
  'use strict';

  const html = V.html;
  const raw = V.raw;
  const esc = V.esc;

  const ui = {};

  /* Primary button: one per visible decision area. Terracotta fill, inverse
     text. A high-commitment action names its consequence in a line beside the
     button rather than borrowing a second accent color (11.2). */
  ui.button = function (label, opts) {
    const o = opts || {};
    const variant = o.variant || 'secondary';
    const attrs = [
      `class="vow-btn vow-btn--${variant}${o.full ? ' vow-btn--full' : ''}"`,
      `data-act="${esc(o.act || 'noop')}"`,
      o.value ? `data-value="${esc(o.value)}"` : '',
      o.disabled ? 'disabled' : '',
      o.ariaLabel ? `aria-label="${esc(o.ariaLabel)}"` : '',
      o.pressed !== undefined ? `aria-pressed="${o.pressed}"` : '',
    ].filter(Boolean).join(' ');
    const icon = o.icon ? V.icon(o.icon, { size: 17 }) : '';
    return `<button type="button" ${attrs}>${esc(label)}${icon}</button>`;
  };

  /* Evidence line: source, freshness, and certainty. Small text plus a
     restrained icon, never a technicolor badge. State is carried by icon and
     wording as well as color, so it survives without color (UI Plan 13). */
  ui.evidence = function (fact) {
    const r = fact && fact.meta ? fact : V.trust.resolve(fact);
    if (!r) return '';
    return html`<p class="vow-evidence" data-state="${r.state}">
      ${raw(V.icon(r.meta.icon, { className: 'vow-evidence__icon' }))}
      <span><span class="vow-sr">${r.meta.name}. </span>${r.line}</span>
    </p>`;
  };

  /* A labelled fact with its value and its evidence. The value renders through
     V.trust.displayValue so an Unknown can never print a figure. */
  ui.factRow = function (fact) {
    const r = fact && fact.meta ? fact : V.trust.resolve(fact);
    if (!r) return '';
    return html`<div class="vow-stack vow-stack--2">
      <div class="vow-row vow-row--between">
        <span style="font-size:var(--vow-font-size-body-small);font-weight:600">${r.label}</span>
        <span style="font-size:var(--vow-font-size-body-small)">${V.trust.displayValue(r)}</span>
      </div>
      ${raw(ui.evidence(r))}
    </div>`;
  };

  /* Reveals expand in place rather than opening a modal, preserving reading
     position (11.4). */
  ui.drawer = function (id, label, body, open) {
    return html`<div class="vow-drawer" data-drawer="${id}" data-open="${open ? 'true' : 'false'}">
      <button type="button" class="vow-drawer__toggle" data-act="toggle-drawer" data-value="${id}"
              aria-expanded="${open ? 'true' : 'false'}">
        ${raw(V.icon('chevron', { className: 'vow-drawer__chevron' }))}${label}
      </button>
      <div class="vow-drawer__body">${raw(body)}</div>
    </div>`;
  };

  /* Agent note: left rule, short first-person sentence, no chat bubble. */
  ui.agentNote = function (text, variant) {
    return html`<p class="vow-agent-note${variant ? ' vow-agent-note--' + variant : ''}">${text}</p>`;
  };

  /* Partner note: initials, a concise direct quote or status, no implication
     that either partner is ahead (2.6, 9.3). */
  ui.partnerNote = function (partnerId, body, opts) {
    const o = opts || {};
    const person = V.byId(V.data.couple.partners, partnerId);
    if (!person) return '';
    return html`<div class="vow-partner">
      <span class="vow-partner__initials" data-person="${person.slot}" aria-hidden="true">${person.initials}</span>
      <div class="vow-partner__body">
        <strong>${person.name}</strong>${o.suffix ? raw(` <span class="vow-quiet">${esc(o.suffix)}</span>`) : ''}
        <div style="margin-top:4px">${raw(body)}</div>
      </div>
    </div>`;
  };

  /* Status: text and icon, never a colored pill (9.1). */
  ui.status = function (text, opts) {
    const o = opts || {};
    return html`<span class="vow-status" data-tone="${o.tone || 'neutral'}">
      ${raw(o.icon ? V.icon(o.icon) : '')}${text}
    </span>`;
  };

  /* The reality check: one tradeoff or unknown, muted but never concealed
     below the fold (9.1). */
  ui.reality = function (text) {
    return html`<p class="vow-reality">${raw(V.icon('alert'))}<span>${text}</span></p>`;
  };

  const STATUS_WORDS = {
    suggested: 'Suggested',
    saved: 'Saved',
    contacted: 'Contacted',
    'tour-proposed': 'Tour proposed',
    toured: 'Toured',
    'ruled-out': 'Ruled out',
  };

  /* Place card: one hero composition, one reason, one reality check, one
     action based on current state (11.2). */
  ui.placeCard = function (place, opts) {
    const o = opts || {};
    const status = STATUS_WORDS[place.status] || 'Suggested';
    const dateFact = place.facts.find((f) => f.category === 'availability');
    const resolved = dateFact ? V.trust.resolve(dateFact) : null;

    return html`<article class="vow-place" data-status="${place.status}">
      <div class="vow-media">${raw(V.imagery.scene(place.scene))}</div>
      <div class="vow-place__body">
        <div>
          <h3 class="vow-place__name">${place.name}</h3>
          <p class="vow-meta">${place.location}. ${place.travel}.</p>
        </div>
        <p class="vow-place__reason">${place.whyItFits[0]}</p>
        ${raw(ui.reality(place.realityCheck))}
        ${raw(resolved ? ui.evidence(resolved) : '')}
        <div class="vow-row" style="margin-top:var(--vow-space-2)">
          ${raw(ui.button(o.primaryLabel || 'Open', { variant: 'secondary', act: 'open-place', value: place.id }))}
          <span class="vow-status">${status}</span>
        </div>
      </div>
    </article>`;
  };

  /* Timeline row: date left, sentence right, status by text and icon, never by
     color alone (11.2). */
  const TIMELINE_WORDS = {
    confirmed: { word: 'Confirmed', icon: 'check', tone: 'ready' },
    proposed: { word: 'Proposed, not confirmed', icon: 'clock', tone: 'neutral' },
    next: { word: 'Next', icon: 'arrow', tone: 'neutral' },
    later: { word: 'Later', icon: 'clock', tone: 'neutral' },
    risk: { word: 'Ends soon', icon: 'alert', tone: 'risk' },
    blocked: { word: 'Waiting on a decision', icon: 'hold', tone: 'neutral' },
    done: { word: 'Done', icon: 'check', tone: 'ready' },
  };

  ui.timelineRow = function (item) {
    const meta = TIMELINE_WORDS[item.state] || TIMELINE_WORDS.next;
    return html`<div class="vow-timeline__row" data-done="${item.state === 'done'}">
      <div class="vow-timeline__date">${V.fmtDate(item.date, 'weekdayShort')}</div>
      <div class="vow-stack vow-stack--2">
        <p class="vow-timeline__text">${item.text}</p>
        ${raw(ui.status(meta.word, { icon: meta.icon, tone: meta.tone }))}
        ${item.blockedBy ? raw(html`<p class="vow-meta">Blocked by: ${item.blockedBy}.</p>`) : ''}
      </div>
    </div>`;
  };

  /* Receipt: what was done, to whom, and what happens next. Replaces a toast
     for anything that left the product (11.4). */
  ui.receipt = function (title, lines, opts) {
    const o = opts || {};
    const rows = lines.map((l) => html`<div class="vow-receipt__line">
      <span class="vow-receipt__key">${l[0]}</span><span>${l[1]}</span>
    </div>`).join('');
    return html`<section class="vow-receipt vow-stack vow-stack--4">
      <div class="vow-row" style="gap:var(--vow-space-2)">
        ${raw(V.icon('check', { size: 19 }))}<h3 class="vow-section-title">${title}</h3>
      </div>
      <div>${raw(rows)}</div>
      ${o.next ? raw(ui.agentNote(esc(o.next))) : ''}
    </section>`;
  };

  /* Budget meter. Segments are labelled in a legend; the "not yet known"
     segment is always shown rather than folded into an optimistic total. */
  ui.meter = function (segments, total) {
    const bars = segments.map((s) =>
      `<span class="vow-meter__seg" data-kind="${esc(s.kind)}" style="width:${(s.amount / total) * 100}%"></span>`
    ).join('');
    const legend = segments.map((s) => html`<span>
      <span class="vow-legend__dot" style="background:${raw(s.color)}"></span>${s.label}, ${V.fmtMoney(s.amount)}
    </span>`).join('');
    return html`<div class="vow-stack vow-stack--3">
      <div class="vow-meter">${raw(bars)}</div>
      <div class="vow-legend">${raw(legend)}</div>
    </div>`;
  };

  ui.pageHead = function (eyebrow, title, lede) {
    return html`<header class="vow-pagehead">
      <p class="vow-label">${eyebrow}</p>
      <h1 class="vow-display">${title}</h1>
      ${lede ? raw(html`<p class="vow-lede">${lede}</p>`) : ''}
    </header>`;
  };

  ui.sectionHead = function (title, note) {
    return html`<div class="vow-section__head vow-stack vow-stack--2">
      <h2 class="vow-section-title">${title}</h2>
      ${note ? raw(html`<p class="vow-meta">${note}</p>`) : ''}
    </div>`;
  };

  /* The imagery credit line. Wherever a composition could be mistaken for a
     photograph of the real place, it says what it is (UI Plan 14). */
  ui.mediaCredit = function () {
    return html`<p class="vow-meta">${V.imagery.credit}</p>`;
  };

  V.ui = ui;
})(window.VowOS);

     ratings, no ad labels, no filter wall (UI Plan 9.1). */

  screens.places = function () {
    const places = V.data.places.map((p) => livePlace(p.id));
    const shown = places.filter((p) => placeStatus(p) !== 'ruled-out');
    const ruledOut = places.filter((p) => placeStatus(p) === 'ruled-out');

    const cards = shown.map((p) => ui.placeCard(p, { primaryLabel: 'Look properly' })).join('');

    return html`
      <div class="vow-col vow-col--wide">
        ${raw(ui.pageHead('Places', `${V.capitalize(V.numberWord(shown.length))} places, chosen for the evening you described.`,
          'These are not search results. Each one was read against what you said matters, and each one has something wrong with it that you should know before you fall in love.'))}

        <div class="vow-stack vow-stack--4">${raw(cards)}</div>

        ${ruledOut.length ? raw(html`
          <section class="vow-section">
            ${raw(ui.sectionHead('Ruled out', 'Kept here in case you change your mind.'))}
            <div class="vow-stack vow-stack--4">${raw(ruledOut.map((p) => ui.placeCard(p)).join(''))}</div>
          </section>`) : ''}

        <section class="vow-section">
          <div class="vow-panel vow-stack vow-stack--3">
            <h2 class="vow-section-title">What you are not seeing</h2>
            <p class="vow-body" style="font-size:var(--vow-font-size-body-small)">
              I read 43 places in your range and set aside 38. Most were ruled out on capacity or on the curfew,
              and eleven never published a 2027 rate. None of this is hidden from you, it is just not worth your evening.
            </p>
            <div class="vow-row">
              ${raw(ui.button('Show me why each one was set aside', { variant: 'quiet', act: 'show-ruled-out' }))}
            </div>
          </div>
        </section>
      </div>`;
  };

  /* Place detail. Gallery, plain-language fit, then capability, budget,
     evidence, and a collapsible list of what is still unverified (9.1). */

  screens.place = function (id) {
    const place = livePlace(id);
    if (!place) return screens.places();

    const facts = V.trust.resolveAll(place.facts);
    const known = facts.filter((f) => f.state === 'confirmed');
    const unsure = facts.filter((f) => f.state !== 'confirmed');
    const fee = facts.find((f) => f.category === 'pricing' && typeof f.value === 'number');
    const remaining = fee ? V.data.budget.comfort - fee.value : null;

    const reasons = place.whyItFits.map((r) => html`<li class="vow-row" style="align-items:flex-start;flex-wrap:nowrap;gap:var(--vow-space-3)">
      <span style="flex:none;margin-top:3px;color:var(--vow-color-moss)">${raw(V.icon('check', { size: 17 }))}</span>
      <span>${r}</span>
    </li>`).join('');

    const tourCheck = V.delegation.evaluate('request-tour', V.state.delegation);
    const status = placeStatus(place);
    const isSaved = status === 'saved' || status === 'toured' || status === 'contacted';

    return html`
      <div class="vow-col vow-col--wide">
        <div class="vow-row" style="margin-bottom:var(--vow-space-5)">
          ${raw(ui.button('All places', { variant: 'quiet', act: 'go', value: '#/places' }))}
        </div>

        <div class="vow-media vow-media--wide">${raw(V.imagery.scene(place.scene))}</div>
        <p class="vow-meta" style="margin-top:var(--vow-space-3)">${V.imagery.credit}</p>

        <header class="vow-stack vow-stack--3" style="margin:var(--vow-space-6) 0 var(--vow-space-7)">
          <h1 class="vow-display vow-display--sm">${place.name}</h1>
          <p class="vow-lede">${place.location}. ${place.travel}.</p>
          <span class="vow-status">${status === 'saved' ? 'Saved' : status === 'contacted' ? 'Contacted, waiting on a reply' : 'Suggested'}</span>
        </header>

        <section class="vow-section vow-stack vow-stack--4">
          ${raw(ui.sectionHead('Why it fits'))}
          <ul class="vow-stack vow-stack--3">${raw(reasons)}</ul>
          ${raw(ui.reality(place.realityCheck))}
        </section>

        ${fee ? raw(html`
        <section class="vow-section">
          ${raw(ui.sectionHead('What it does to your budget'))}
          <div class="vow-panel vow-stack vow-stack--4">
            <div class="vow-row vow-row--between vow-row--baseline">
              <span class="vow-compare__amount">${V.fmtMoney(fee.value)}</span>
              <span class="vow-meta">site fee</span>
            </div>
            ${raw(ui.evidence(fee))}
            <hr class="vow-rule"/>
            <p style="font-size:var(--vow-font-size-body-small)">
              That leaves ${V.fmtMoney(remaining)} of your ${V.fmtMoney(V.data.budget.comfort)} comfort for everything else.
            </p>
            ${raw(ui.agentNote('This is not a total. It excludes the service charge, which we have not confirmed here yet.'))}
          </div>
        </section>`) : ''}

        <section class="vow-section">
          ${raw(ui.sectionHead('What we know', 'Verified against the place itself, with the date it was checked.'))}
          <div class="vow-stack vow-stack--5">${raw(known.map((f) => ui.factRow(f)).join(''))}</div>
        </section>

        <section class="vow-section">
          ${raw(ui.drawer('verify-' + place.id,
            `What we still need to verify (${unsure.length})`,
            html`<div class="vow-stack vow-stack--5" style="padding-top:var(--vow-space-3)">
              ${raw(unsure.map((f) => ui.factRow(f)).join(''))}
            </div>`,
            V.state.drawers['verify-' + place.id]))}
        </section>

        <section class="vow-section">
          <div class="vow-surface vow-stack vow-stack--4">
            <h2 class="vow-section-title">What would you like to do?</h2>
            <div class="vow-row vow-row--actions">
              ${raw(ui.button('Ask VowOS to request a tour', {
                variant: 'primary', act: 'request-tour', value: place.id,
              }))}
              ${raw(ui.button(isSaved ? 'Saved' : 'Save this place', {
                variant: 'secondary', act: 'save-place', value: place.id, disabled: isSaved,
              }))}
              ${raw(ui.button('Rule it out', { variant: 'quiet', act: 'rule-out', value: place.id }))}
            </div>
            <p class="vow-consequence">${tourCheck.reason}</p>
          </div>
        </section>
      </div>`;
  };

  V.screens = Object.assign(V.screens || {}, screens);
})(window.VowOS);

/* js/screens-plan.js */
/* VowOS prototype — Decision Room, tour coordination, Plan, Guests,
 * Website Studio, and the living design system page.
 * Priority artifacts 4, 5, and 6 from UI Plan section 17.
 */
(function (V) {
  'use strict';

  const html = V.html;
  const raw = V.raw;
  const ui = V.ui;
  const screens = {};

  /* ================================================= 4. DECISION ROOM == */
  /* The most visual restraint in the product. Two choices side by side, one
     calm recommendation, evidence one layer deeper, and a named consequence on
     the action. When both partners must approve and disagree, the room holds
     the decision open and offers a next step instead of a tie-breaker (9.3). */

  screens.decide = function () {
    const d = V.data;
    const dec = d.decision;
    const options = dec.options.map((id) => V.byId(d.places, id));
    const [a, b] = options;

    const factOf = (place, id) => V.trust.resolve(place.facts.find((f) => f.id === id));
    /* Cells are tagged by column so that narrow screens can show one option at
       a time rather than stacking two unlabelled answers under one row label
       (UI Plan 9.3). */
    const slot = (i) => (i === 0 ? 'a' : 'b');
    const cell = (content, i) => `<div class="vow-compare__cell vow-compare__cell--${slot(i)}">${content}</div>`;
    const label = (text) => `<div class="vow-compare__label">${V.esc(text)}</div>`;
    const focus = V.state.compareFocus || 'a';

    const scenarios = d.budget.scenarios;
    const baseline = d.budget.committed.reduce((n, i) => n + i.amount, 0) +
      d.budget.projected.reduce((n, i) => n + i.amount, 0);

    const heads = options.map((p, i) => `<div class="vow-compare__cell vow-compare__cell--${slot(i)} vow-compare__head">
      <div class="vow-media" style="margin-bottom:var(--vow-space-4)">${V.imagery.scene(p.scene)}</div>
      <h2 class="vow-title" style="font-size:23px">${V.esc(p.name)}</h2>
      <p class="vow-meta">${V.esc(p.location)}. ${V.esc(p.travel)}.</p>
    </div>`).join('');

    const fitCells = options.map((p, i) => cell(html`
      <p>${p.whyItFits[0]}</p>
      ${raw(ui.reality(p.realityCheck))}`, i)).join('');

    const costCells = options.map((p, i) => {
      const s = scenarios.find((x) => x.placeId === p.id);
      const total = baseline + s.siteFee;
      const delta = d.budget.comfort - total;
      return cell(html`
        <p class="vow-compare__amount">${V.fmtMoney(s.siteFee)}</p>
        <p class="vow-meta">site fee</p>
        <p style="margin-top:var(--vow-space-3)">
          Everything you have planned so far comes to ${V.fmtMoney(total)}.
          ${delta >= 0
            ? raw(html`That is ${V.fmtMoney(delta)} inside your comfort.`)
            : raw(html`That is ${V.fmtMoney(Math.abs(delta))} over your comfort.`)}
        </p>
        ${raw(ui.evidence(factOf(p, p.id === 'orchard-house' ? 'oh-fee' : 'm98-fee')))}`, i);
    }).join('');

    const practicalCells = options.map((p, i) => {
      const ids = p.id === 'orchard-house'
        ? ['oh-cap', 'oh-curfew', 'oh-rain', 'oh-access']
        : ['m98-cap', 'm98-curfew', 'm98-rain', 'm98-access'];
      return cell(html`<div class="vow-stack vow-stack--3">
        ${raw(ids.map((id) => {
          const f = factOf(p, id);
          return html`<p style="font-size:var(--vow-font-size-body-small)">
            <span class="vow-quiet">${f.label}.</span> ${V.trust.displayValue(f)}
          </p>`;
        }).join(''))}
      </div>`, i);
    }).join('');

    const evidenceCells = options.map((p, i) => {
      const facts = V.trust.resolveAll(p.facts);
      const gaps = facts.filter((f) => f.state !== 'confirmed');
      return cell(html`
        <p class="vow-meta">${V.capitalize(V.numberWord(facts.length - gaps.length))} of ${raw(V.numberWord(facts.length))} facts verified with the place itself.</p>
        ${raw(ui.drawer('ev-' + p.id, `${gaps.length} we are not sure about`,
          html`<div class="vow-stack vow-stack--4">${raw(gaps.map((f) => ui.factRow(f)).join(''))}</div>`,
          V.state.drawers['ev-' + p.id]))}`, i);
    }).join('');

    /* Persistent on narrow screens, hidden once both columns fit side by side. */
    const switcher = html`<div class="vow-compare-switch" role="group" aria-label="Which place are you looking at?">
      <span class="vow-label" style="width:100%">Looking at</span>
      ${raw(options.map((p, i) => ui.button(p.name, {
        variant: 'secondary', act: 'pick-compare', value: slot(i), pressed: slot(i) === focus,
      })).join(''))}
    </div>`;

    const positions = dec.positions.map((pos) => {
      const place = V.byId(d.places, pos.prefers);
      return html`<div class="vow-panel">
        ${raw(ui.partnerNote(pos.partner, html`
          <p style="margin-bottom:var(--vow-space-3)"><strong>${place.name}</strong></p>
          <p class="vow-quiet">${pos.note}</p>`, { suffix: 'prefers' }))}
      </div>`;
    }).join('');

    const holdCheck = V.delegation.evaluate('ask-question', V.state.delegation);

    return html`
      <div class="vow-col vow-col--wide">
        ${raw(ui.pageHead('Decision room', dec.title))}

        <section class="vow-surface vow-surface--airy vow-stack vow-stack--4">
          <p class="vow-label">What VowOS thinks</p>
          <p class="vow-body" style="font-size:19px">${dec.recommendation}</p>
          ${raw(ui.drawer('why-rec', 'How I got there',
            html`<div class="vow-stack vow-stack--3">
              <p style="font-size:var(--vow-font-size-body-small)">
                Both places clear everything on your confirmed priorities except one each.
                The Orchard House fails nothing outright but costs ${raw(V.fmtMoney(7400))} more.
                Maison 98 seats 96 if the ceremony has to move indoors, and you are planning for 110.
              </p>
              <p style="font-size:var(--vow-font-size-body-small)">
                I have not weighted your priorities against each other, because you have not told me how,
                and guessing at that is how I would get this wrong.
              </p>
            </div>`, V.state.drawers['why-rec']))}
        </section>

        <section class="vow-section">
          ${raw(switcher)}
          <div class="vow-compare" data-focus="${focus}">
            <div class="vow-compare__label vow-compare__head"></div>
            ${raw(heads)}
            ${raw(label('Fit'))}${raw(fitCells)}
            ${raw(label('Cost'))}${raw(costCells)}
            ${raw(label('Practicality'))}${raw(practicalCells)}
            ${raw(label('Evidence'))}${raw(evidenceCells)}
          </div>
          <p class="vow-meta" style="margin-top:var(--vow-space-4)">
            Neither total includes a service charge. We have not confirmed one at either place,
            so these are working figures, not quotes.
          </p>
        </section>

        <section class="vow-section">
          ${raw(ui.sectionHead('Where you both are', 'Both positions, as you each described them. Nothing moves forward until you agree.'))}
          <div class="vow-positions">${raw(positions)}</div>
        </section>

        <section class="vow-section">
          <div class="vow-surface vow-stack vow-stack--5">
            <h2 class="vow-section-title">What happens next</h2>
            <p class="vow-body" style="font-size:var(--vow-font-size-body-small)">${dec.openQuestion}</p>
            <hr class="vow-rule"/>
            <div class="vow-row vow-row--actions">
              ${raw(ui.button('Ask them to extend the hold', { variant: 'primary', act: 'extend-hold' }))}
              ${raw(ui.button('Leave a note for each other', { variant: 'secondary', act: 'leave-note' }))}
              ${raw(ui.button('We have agreed on one', { variant: 'quiet', act: 'open-commit' }))}
            </div>
            <p class="vow-consequence">
              ${dec.deadlineNote} ${holdCheck.reason}
            </p>
          </div>
        </section>
      </div>`;
  };

  /* ==================================================== 5. TOUR VISIT == */
  /* A thoughtful calendar invitation. The interface never implies the system
     has booked something when it has only proposed a time (UI Plan 9.2). */

  screens.tour = function () {
    const d = V.data;
    const confirmed = d.tours.filter((t) => (V.state.tourStatus[t.id] || t.status) === 'confirmed');
    const proposing = d.tours.filter((t) => (V.state.tourStatus[t.id] || t.status) !== 'confirmed');

    const confirmedCards = confirmed.map((t) => {
      const place = V.byId(d.places, t.placeId);
      const when = t.confirmedFor || V.state.tourConfirmedFor;
      return html`<div class="vow-surface vow-stack vow-stack--4">
        <div class="vow-row vow-row--between">
          <h2 class="vow-section-title">${place.name}</h2>
          ${raw(ui.status('Confirmed by the place', { icon: 'check', tone: 'ready' }))}
        </div>
        <p style="font-family:var(--vow-font-display);font-size:27px">
          ${V.fmtDate(when, 'weekday')} at ${raw(V.fmtTime(when))}
        </p>
        <p class="vow-meta">${place.travel}. ${t.reason}</p>
        <div class="vow-row vow-row--actions">
          ${raw(ui.button('Add to our calendars', { variant: 'primary', act: 'add-calendar', value: t.id }))}
          ${raw(ui.button('See the tour brief', { variant: 'secondary', act: 'tour-brief', value: t.id }))}
        </div>
        ${raw(ui.agentNote('I will send you both a short list of questions the day before, built from what we still have not verified.'))}
      </div>`;
    }).join('');

    const requests = proposing.map((t) => {
      const place = V.byId(d.places, t.placeId);
      const dates = [];
      t.windows.forEach((w) => { if (dates.indexOf(w.date) === -1) dates.push(w.date); });
      const activeDate = V.state.tourDate || dates[0];
      const windows = t.windows.filter((w) => w.date === activeDate);

      const rail = dates.map((date) => html`<button type="button" class="vow-dateopt"
          data-act="pick-tour-date" data-value="${date}" aria-pressed="${date === activeDate}">
        <span class="vow-dateopt__day">${V.fmtDate(date, 'weekdayShort')}</span>
        <span class="vow-dateopt__note">${V.numberWord(t.windows.filter((w) => w.date === date).length)} times offered</span>
      </button>`).join('');

      const times = windows.map((w) => html`<button type="button" class="vow-timeopt"
          data-act="pick-tour-time" data-value="${w.id}" aria-pressed="${V.state.tourSelection === w.id}">
        <span class="vow-timeopt__time">${V.fmtTime(w.time)}</span>
        <span class="vow-timeopt__meta">${w.note}</span>
      </button>`).join('');

      const selected = t.windows.find((w) => w.id === V.state.tourSelection);

      return html`<div class="vow-stack vow-stack--5">
        <div class="vow-row vow-row--between">
          <h2 class="vow-section-title">${place.name}</h2>
          ${raw(ui.status('No time requested yet', { icon: 'clock' }))}
        </div>
        <p class="vow-lede">${t.reason} ${place.travel}.</p>
        <div class="vow-tour">
          <div class="vow-daterail">${raw(rail)}</div>
          <div class="vow-stack vow-stack--4">
            <div class="vow-times">${raw(times)}</div>
            <hr class="vow-rule"/>
            <div class="vow-row vow-row--actions">
              ${raw(ui.button('Ask for this time', {
                variant: 'primary', act: 'ask-tour-time', value: t.id, disabled: !selected,
              }))}
              ${raw(ui.button('None of these work', { variant: 'quiet', act: 'no-times-work' }))}
            </div>
            <p class="vow-consequence">
              ${selected
                ? raw(html`This sends ${raw(place.name)} a request for ${raw(V.fmtDate(selected.date, 'weekday'))} at ${raw(V.fmtTime(selected.time))} Nothing is booked until they answer.`)
                : 'Choose a time to see exactly what gets sent.'}
            </p>
          </div>
        </div>
      </div>`;
    }).join('');

    return html`
      <div class="vow-col vow-col--wide">
        ${raw(ui.pageHead('Tours', 'Seeing the places.',
          'A time is proposed, held, or confirmed. VowOS will always tell you which one it is.'))}
        <div class="vow-stack vow-stack--6">${raw(confirmedCards)}</div>
        <section class="vow-section">${raw(requests)}</section>
      </div>`;
  };

  /* ========================================================== 6. PLAN == */
  /* A gently structured timeline, not a project board. Budget health at the
     top, the next six to eight weeks by default (UI Plan 9.4). */

  screens.plan = function () {
    const d = V.data;
    const committed = d.budget.committed.reduce((n, i) => n + i.amount, 0);
    const projected = d.budget.projected.reduce((n, i) => n + i.amount, 0);
    const unallocated = d.budget.comfort - committed - projected;

    const meter = ui.meter([
      { kind: 'committed', label: 'Committed', amount: committed, color: 'var(--vow-color-moss)' },
      { kind: 'projected', label: 'Planned, not committed', amount: projected, color: 'var(--vow-color-rose-clay)' },
      { kind: 'unknown', label: 'Not allocated yet', amount: unallocated, color: 'var(--vow-color-hairline-strong)' },
    ], d.budget.comfort);

    const scenarios = d.budget.scenarios.map((s) => {
      const place = V.byId(d.places, s.placeId);
      const total = committed + projected + s.siteFee;
      const delta = d.budget.comfort - total;
      return html`<div class="vow-receipt__line">
        <span class="vow-receipt__key">With ${place.name}</span>
        <span>
          <strong>${V.fmtMoney(total)}</strong><span class="vow-quiet">${delta >= 0
            ? raw(html`, ${V.fmtMoney(delta)} inside your comfort`)
            : raw(html`, ${V.fmtMoney(Math.abs(delta))} over your comfort`)}</span>
          <span class="vow-meta" style="display:block;margin-top:4px">${s.note}</span>
        </span>
      </div>`;
    }).join('');

    const lines = d.budget.projected.concat(d.budget.committed)
      .map((item) => ui.factRow(Object.assign({}, item, { label: item.label, value: item.amount }))).join('');

    const rows = d.timeline.map((item) => ui.timelineRow(item)).join('');

    const docs = d.documents.map((doc) => html`<li class="vow-receipt__line">
      <span class="vow-receipt__key">${doc.kind}</span>
      <span>${doc.name}
        <span class="vow-meta" style="display:block;margin-top:4px">From ${doc.source}, ${V.fmtDate(doc.date, 'long')}.</span>
      </span>
    </li>`).join('');

    return html`
      <div class="vow-col">
        ${raw(ui.pageHead('Plan', 'Where the wedding stands.',
          'The next eight weeks. Everything further out is there when you want it.'))}

        <section class="vow-surface vow-stack vow-stack--5">
          <div class="vow-row vow-row--between vow-row--baseline">
            <h2 class="vow-section-title">Budget</h2>
            <span class="vow-meta">${V.fmtMoney(d.budget.comfort)} comfort</span>
          </div>
          ${raw(meter)}
          <p class="vow-meta">The place is not in these figures yet. It will take most of what is unallocated.</p>
          <hr class="vow-rule"/>
          <div>${raw(scenarios)}</div>
          ${raw(ui.agentNote('Neither figure includes a service charge. Until one of them confirms it, I will not show you a total that looks final.'))}
          ${raw(ui.drawer('budget-lines', 'Every line',
            html`<div class="vow-stack vow-stack--5">${raw(lines)}</div>`,
            V.state.drawers['budget-lines']))}
        </section>

        <section class="vow-section">
          ${raw(ui.sectionHead('What happens next'))}
          <div class="vow-timeline">${raw(rows)}</div>
        </section>

        <section class="vow-section">
          ${raw(ui.sectionHead('Documents and commitments'))}
          <ul>${raw(docs)}</ul>
        </section>
      </div>`;
  };

  /* ======================================================== 7. GUESTS == */
  /* People, not rows in a CRM. Household readiness first, individual records
     only when someone needs to act (UI Plan 9.5). */

  screens.guests = function () {
    const g = V.data.guests;
    const clusters = g.clusters.map((c) => html`<div class="vow-panel vow-stack vow-stack--2">
      <span class="vow-cluster__count">${c.count}</span>
      <span style="font-weight:600;font-size:var(--vow-font-size-body-small)">${c.label}</span>
      <span class="vow-meta">${c.note}</span>
    </div>`).join('');

    return html`
      <div class="vow-col">
        ${raw(ui.pageHead('Guests', `${g.households} households, about ${g.expected} people.`, g.note))}
        <div class="vow-cluster">${raw(clusters)}</div>

        <section class="vow-section">
          <div class="vow-surface vow-stack vow-stack--4">
            <h2 class="vow-section-title">One thing would move this along</h2>
            <p class="vow-body" style="font-size:var(--vow-font-size-body-small)">
              Eighteen households have no address. Save the dates cannot go out to them,
              and save the dates cannot go out at all until the place is decided.
              If you want, I can draft a short message asking those eighteen for an address.
            </p>
            <div class="vow-row vow-row--actions">
              ${raw(ui.button('Draft the message', { variant: 'primary', act: 'draft-address-request' }))}
              ${raw(ui.button('Show me the households', { variant: 'secondary', act: 'show-households' }))}
            </div>
            <p class="vow-consequence">Drafting does not send anything. You will see the exact message and the exact eighteen names first.</p>
          </div>
        </section>
      </div>`;
  };

      case 'studio': return V.screens.studio();
      case 'system': return V.screens.system();
      case 'more': return V.screens.more();
      case 'today':
      default: return V.screens.today();
    }
  }

  function render() {
    const route = V.state.route;
    /* Keyboard focus survives a re-render, which is what makes the keyboard
       path in UI Plan 13 real rather than aspirational. */
    const activeEl = document.activeElement;
    const focusKey = activeEl && activeEl.dataset && activeEl.dataset.act
      ? activeEl.dataset.act + '|' + (activeEl.dataset.value || '')
      : null;
    const scroll = window.scrollY;

    const root = document.getElementById('app');
    root.innerHTML = html`
      <a class="vow-skip" href="#vow-main">Skip to the main content</a>
      <div class="vow-shell">
        ${raw(renderRail(route))}
        <div>
          <div class="vow-mobilehead">
            <span class="vow-brand__mark" style="font-size:19px">VowOS</span>
            <span class="vow-meta">${V.data.couple.title}, ${V.fmtDate(V.data.wedding.date, 'long')}</span>
          </div>
          <main class="vow-canvas" id="vow-main" tabindex="-1">${raw(renderScreen(route))}</main>
        </div>
      </div>
      ${raw(renderTabs(route))}
      ${raw(renderDialog())}
      ${V.state.toast ? raw(html`<div class="vow-toast">${V.state.toast}</div>`) : ''}
      <div class="vow-sr" role="status" aria-live="polite">${V.state.announcement}</div>`;

    if (V.state.dialog) {
      const dialog = root.querySelector('.vow-dialog');
      if (dialog) dialog.focus();
    } else if (focusKey) {
      const restored = root.querySelector(
        `[data-act="${focusKey.split('|')[0]}"]${focusKey.split('|')[1] ? `[data-value="${focusKey.split('|')[1]}"]` : ''}`
      );
      if (restored) restored.focus({ preventScroll: true });
      window.scrollTo({ top: scroll, behavior: 'instant' in window ? 'instant' : 'auto' });
    }
  }

  V.render = render;

  /* ------------------------------------------------------------ actions */

  const ACTIONS = {
    noop: function () {},

    go: function (value) {
      window.location.hash = value;
    },

    'toggle-drawer': function (value) {
      V.state.drawers[value] = !V.state.drawers[value];
      render();
    },

    'defer-decision': function () {
      toast('Nothing moves until you say so. I will bring this back on Monday, August 17.');
    },

    'choose-palette': function (value) {
      V.state.palette = value;
      const p = V.byId(V.data.vision.palettes, value);
      toast(`${p.name} is now your direction. Your guest website follows it.`);
    },

    'set-delegation': function (value) {
      V.state.delegation.level = value;
      toast(`Changed. ${V.delegation.levelById(value).summary}`);
    },

    'toggle-scope': function (value) {
      const list = V.state.delegation.scopes;
      const at = list.indexOf(value);
      if (at === -1) list.push(value); else list.splice(at, 1);
      const scope = V.byId(V.delegation.SCOPES, value);
      toast(at === -1
        ? `On. VowOS will now do this without asking: ${scope.label.toLowerCase()}.`
        : `Off. VowOS will ask you first from now on.`);
    },

    'confirm-vision': function () {
      toast('Confirmed. I will look for places against this, and tell you when something does not fit.');
    },

    'refine-feeling': function () {
      toast('Tell me what is off and I will rewrite it. Nothing else changes until you are happy with this.');
    },

    'answer-question': function () {
      toast('Answered. That takes one unknown out of the comparison.');
    },

    'skip-question': function () {
      toast('Skipped. I will stop asking, and I will say it is unknown rather than guess.');
    },

    /* Narrow screens compare one place at a time. Switching focus never
       changes either option's state, only which one is on screen (11.4). */
    'pick-compare': function (value) {
      V.state.compareFocus = value;
      render();
    },

    'open-place': function (value) {
      window.location.hash = '#/places/' + value;
    },

    'save-place': function (value) {
      V.state.placeStatus[value] = 'saved';
      const place = V.byId(V.data.places, value);
      toast(`${place.name} is saved. It is in your places, nothing has been sent to them.`);
    },

    'rule-out': function (value) {
      openDialog('ruleOut', { placeId: value });
    },

    'confirm-rule-out': function (value) {
      const [id, reason] = value.split('|');
      V.state.placeStatus[id] = 'ruled-out';
      const place = V.byId(V.data.places, id);
      closeDialog();
      toast(reason
        ? `${place.name} is out. I will stop suggesting places that are ${reason.toLowerCase()}.`
        : `${place.name} is out. It stays in your list in case you change your mind.`);
    },

    'show-ruled-out': function () {
      toast('All 38 are there with the reason each one was set aside. Nothing is hidden, it is just not in your way.');
    },

    /* Delegation-aware. A request for a tour time is covered by a standing
       approval; without that approval it becomes an explicit ask. */
    'request-tour': function (value) {
      const result = V.delegation.evaluate('request-tour', V.state.delegation);
      const place = V.byId(V.data.places, value);
      if (!result.allowed) {
        openDialog('needsApproval', { reason: result.reason, confirmAct: 'go', value: '#/tour' });
        return;
      }
      window.location.hash = '#/tour';
      setTimeout(() => toast(`${result.reason} Choose a time and I will ask ${place.name} for it.`), 60);
    },

    'pick-tour-date': function (value) {
      V.state.tourDate = value;
      V.state.tourSelection = null;
      render();
    },

    'pick-tour-time': function (value) {
      V.state.tourSelection = value;
      render();
    },

    'ask-tour-time': function (value) {
      const tour = V.byId(V.data.tours, value);
      const window_ = tour.windows.find((w) => w.id === V.state.tourSelection);
      if (!window_) return;
      openDialog('approveTour', { placeId: tour.placeId, window: window_, value });
    },

    'confirm-tour-time': function (value) {
      const tour = V.byId(V.data.tours, value) || V.data.tours[1];
      const window_ = tour.windows.find((w) => w.id === V.state.tourSelection);
      const place = V.byId(V.data.places, tour.placeId);
      closeDialog();
      /* fmtTime already ends in a period ("5:30 p.m."), so the sentence
         continues without adding a second one. */
      toast(`Asked. ${place.name} has your request for ${V.fmtDate(window_.date, 'weekday')} at ${V.fmtTime(window_.time)} Nothing is booked until they answer, and I will tell you when they do.`);
    },

    'no-times-work': function () {
      toast('Understood. I will ask them what else they have, rather than making you guess.');
    },

    'add-calendar': function () {
      toast('Added to both your calendars, with the travel time from Rhinecliff built in.');
    },

    'tour-brief': function () {
      openDialog('tourBrief', {});
    },

    'extend-hold': function () {
      const result = V.delegation.evaluate('ask-question', V.state.delegation);
      if (!result.allowed) {
        openDialog('needsApproval', { reason: result.reason });
        return;
      }
      toast('Asked. The Orchard House has a request to hold June 12 past Friday. I will tell you either way by Thursday.');
    },

    'leave-note': function () {
      openDialog('note', {});
    },

    'confirm-note': function () {
      closeDialog();
      toast('Left for Alex. It is between you both, and it does not change what I recommend.');
    },

    'open-commit': function () {
      openDialog('commit', {});
    },

    'draft-address-request': function () {
      openDialog('addressRequest', {});
    },

    'show-households': function () {
      toast('Eighteen households, with what is missing from each. None of them have been contacted.');
    },

    'pick-section': function (value) {
      V.state.siteSection = value;
      render();
    },

    'publish-site': function () {
      const result = V.delegation.evaluate('publish-website', V.state.delegation);
      if (!result.allowed) {
        openDialog('publish', {});
        return;
      }
      openDialog('publish', {});
    },

    'confirm-publish': function () {
      V.data.website.published = true;
      closeDialog();
      toast('Published. Two chapters changed. Nobody was notified.');
    },

    'view-as-guest': function () {
      toast('This is what a guest sees. Nothing about your budget, your places, or your notes is on that page.');
    },

    'close-dialog': function () {
      closeDialog();
    },
  };

  /* ------------------------------------------------------------- events */

  function onClick(event) {
    const trigger = event.target.closest('[data-act]');
    if (!trigger) return;

    /* Clicking the dialog body must not close the dialog behind it. */
    if (trigger.classList.contains('vow-scrim') && event.target.closest('[data-stop]')) return;

    const act = trigger.dataset.act;
    const handler = ACTIONS[act];
    if (!handler) return;

    event.preventDefault();
    handler(trigger.dataset.value || '');
  }

  function onKeydown(event) {
    if (event.key === 'Escape' && V.state.dialog) {
      event.preventDefault();
      closeDialog();
    }
  }

  function onHashChange() {
    V.state.route = parseRoute();
    V.state.dialog = null;
    render();
    const main = document.getElementById('vow-main');
    if (main) {
      window.scrollTo({ top: 0 });
      main.focus({ preventScroll: true });
    }
  }

  function start() {
    V.state.route = parseRoute();
    document.addEventListener('click', onClick);
    document.addEventListener('keydown', onKeydown);
    window.addEventListener('hashchange', onHashChange);
    render();
  }

  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', start);
  } else {
    start();
  }
})(window.VowOS);

</script>
</body>
</html>
